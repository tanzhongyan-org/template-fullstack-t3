id: app-no-db-import
language: TypeScript
severity: error
message: "Pages and layouts must reach data through tRPC, not ~/server/db. Route handlers are the API layer and may import it."
files:
  - "src/app/**"
ignores:
  - "src/app/**/route.ts"
  - "src/app/**/route.test.ts"
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    kind: string
    regex: "^.~/server/db(/|.$)"
