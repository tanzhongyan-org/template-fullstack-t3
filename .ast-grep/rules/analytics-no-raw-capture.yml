id: no-raw-capture
message: "Send analytics through the taxonomy (track/trackServer), never a raw capture call."
severity: error
language: TypeScript
ignores:
  - "src/server/analytics.ts"
rule:
  pattern: "$CLIENT.capture($$$)"
