id: no-unstable-cache
message: "Use cacheComponents with 'use cache' + cacheTag, not unstable_cache or segment revalidate."
severity: error
language: TypeScript
files:
  - "src/**"
rule:
  any:
    - pattern: "unstable_cache"
    - pattern: "export const revalidate = $VALUE"
