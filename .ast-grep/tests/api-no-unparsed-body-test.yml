id: no-unparsed-body
valid:
  - "const parsed = await parseJsonBody(req, schema);"
  - "const raw = await readRawBody(req);"
  - "return Response.json({ ok: true }, { status: 200 });"
invalid:
  - "const body = await req.json();"
  - "const text = await req.text();"
  - "const form = await req.formData();"
