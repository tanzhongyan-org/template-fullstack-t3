name: Preview checks

on:
  deployment_status:

permissions:
  contents: read

jobs:
  preview:
    if: github.event.deployment_status.state == 'success'
    uses: tanzhongyan-org/.github/.github/workflows/preview-checks.yml@770874f61526508deac7a5713e408079ba016d62 # v1
    with:
      runtime: t3
      preview-url: ${{ github.event.deployment_status.target_url }}
      install-command: bun install --frozen-lockfile
    secrets:
      preview-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
