name: Preview checks

on:
  deployment_status:

permissions:
  contents: read

jobs:
  preview:
    if: github.event.deployment_status.state == 'success'
    uses: tanzhongyan-org/.github/.github/workflows/preview-checks.yml@33bb193f8f32e5b3f715c9e1dff6e36667d8e70d # fleet pin 2026-10-29
    with:
      runtime: t3
      preview-url: ${{ github.event.deployment_status.target_url }}
      install-command: bun install --frozen-lockfile
    secrets:
      preview-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
