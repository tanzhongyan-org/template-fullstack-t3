name: Migrate

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migrate:
    # The template has no production database; derived repos set ENABLE_DEPLOY
    # and DIRECT_DATABASE_URL when they take the deploy path.
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    uses: tanzhongyan-org/.github/.github/workflows/migrate.yml@0c54f703d2d0d24b6ec61c8ea0f0d1a7d220f3e9 # fleet pin 2026-10-29
    with:
      runtime: t3
      install-command: bun install --frozen-lockfile
      migrate-target: db-migrate
    secrets:
      database-url: ${{ secrets.DIRECT_DATABASE_URL }}
