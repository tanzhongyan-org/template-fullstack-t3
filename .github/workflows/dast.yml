name: DAST

on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    uses: tanzhongyan-org/.github/.github/workflows/dast.yml@33bb193f8f32e5b3f715c9e1dff6e36667d8e70d # fleet pin 2026-10-29
    with:
      runtime: t3
      tool: zap
      postgres-db: template_fullstack_t3
      database-url: postgresql://postgres:password@localhost:5432/template_fullstack_t3
      base-url: http://localhost:3000
      health-url: http://localhost:3000/api/health
      install-command: bun install --frozen-lockfile
      db-setup-command: make db-migrate
      build-command: bun run build
      start-command: bun run start
      # No identity replacer: replacer.full_list(0) with REQ_HEADER injects a
      # malformed empty-name ": <value>" header under ZAP 2.17.0 (packet
      # captured), and strict parsers answer every request 400. The baseline
      # therefore scans the public surface; authed routes are covered by E2E.
      zap-cmd-options: -c /zap/wrk/.zap/rules.tsv
