name: Backup

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  backup:
    # The template has no production database; derived repos set ENABLE_DEPLOY,
    # the bucket, and the secrets below when they take the deploy path.
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    uses: tanzhongyan-org/.github/.github/workflows/backup.yml@0c54f703d2d0d24b6ec61c8ea0f0d1a7d220f3e9 # fleet pin 2026-10-29
    with:
      bucket: s3://example-template-db-backups/db-backups
      aws-region: ap-southeast-1
    secrets:
      database-url: ${{ secrets.DIRECT_DATABASE_URL }}
      aws-access-key-id: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      notify-webhook: ${{ secrets.BACKUP_NOTIFY_WEBHOOK }}
