name: Initialize Template Repository

on:
  push:
    branches: [main]

jobs:
  init-repo:
    # Only run on repositories created from the template, not on the template itself
    if: github.repository != 'tanzhongyan-org/template-fullstack-t3'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rename template placeholders
        run: |
          NEW_NAME="${GITHUB_REPOSITORY#*/}"
          NEW_NAME_SNAKE="${NEW_NAME//-/_}"
          echo "Renaming template-fullstack-t3 to $NEW_NAME..."
          find . -type f \( -name "*.json" -o -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.md" -o -name "*.jsonc" -o -name "*.yml" \) \
            -not -path "*/.git/*" \
            -not -path "*/node_modules/*" \
            -not -path "*/.next/*" \
            -exec sed -i "s/template-fullstack-t3/$NEW_NAME/g; s/template_fullstack_t3/$NEW_NAME_SNAKE/g" {} +

      - name: Remove init workflow and commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/init.yml
          git commit -m "chore: initialize repository from template-fullstack-t3"
          git push
