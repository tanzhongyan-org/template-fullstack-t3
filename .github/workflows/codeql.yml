name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    uses: tanzhongyan-org/.github/.github/workflows/codeql.yml@0c54f703d2d0d24b6ec61c8ea0f0d1a7d220f3e9 # fleet pin 2026-10-29
    with:
      runtime: t3
      language: javascript-typescript
      build-mode: none
