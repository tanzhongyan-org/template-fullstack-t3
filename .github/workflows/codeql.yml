name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    uses: tanzhongyan-org/.github/.github/workflows/codeql.yml@33bb193f8f32e5b3f715c9e1dff6e36667d8e70d # fleet pin 2026-10-29
    with:
      runtime: t3
      language: javascript-typescript
      build-mode: none
